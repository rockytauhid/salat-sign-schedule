name: Android TV CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: Test, Lint & Build Both Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests & Lint across all modules
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug

      - name: Assemble Debug APKs (SalatSign & SalatSchedule)
        run: ./gradlew :app-salatsign:assembleDebug :app-salatschedule:assembleDebug

      - name: Assemble Release APKs (R8 Shrinking Verification)
        run: ./gradlew :app-salatsign:assembleRelease :app-salatschedule:assembleRelease

      - name: Upload Lint Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore
