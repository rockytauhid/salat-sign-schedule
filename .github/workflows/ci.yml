name: Android TV CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: Test, Lint & Build Both Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Run Unit Tests & Lint across all modules
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug

      - name: Assemble Debug APKs (SalatSign & SalatSchedule)
        run: ./gradlew :app-salatsign:assembleDebug :app-salatschedule:assembleDebug

      - name: Generate Ephemeral CI Keystore & Assemble Release APKs (R8 Verification)
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/ci-release.jks
          RELEASE_STORE_PASSWORD: ci-ephemeral-password
          RELEASE_KEY_ALIAS: ci-release
          RELEASE_KEY_PASSWORD: ci-ephemeral-password
        run: |
          keytool -genkeypair -v \
            -keystore "$RELEASE_STORE_FILE" \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            -keypass "$RELEASE_KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=SalatSign CI, OU=CI, O=SalatSign, L=Canberra, ST=ACT, C=AU"
          ./gradlew :app-salatsign:assembleRelease :app-salatschedule:assembleRelease

      - name: Upload Lint Reports on Failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore
